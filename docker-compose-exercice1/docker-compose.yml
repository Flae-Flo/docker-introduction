
services:  # conteneurs, équivalent de docker container run
  drupal: # nom du conteneur, également nom DNS dans le réseau
    container_name: drupal # Optionnel 
    image: drupal:10-apache # Optionnel en cas de build:
    ports: # Optionnel. Equivalent de -p dans docker container run
    - "8081:80" 
    volumes:
    - drupal_modules:/var/www/html/modules
    - drupal_profiles:/var/www/html/profiles
    - drupal_themes:/var/www/html/themes
    - drupal_sites:/var/www/html/sites # Optionnel. Equivalent de -v dans docker container run
  postgresql: 
    container_name: postgresql 
    image: postgres:16 
    environment: # Optionnel. Equivalent de -e dans docker container run
      POSTGRES_PASSWORD: mysecretpassword
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    volumes:
    - postgres_data:/var/lib/postgresql/data 

volumes: # Optionnel. Equivalent de docker volume create
  drupal_modules:
  drupal_profiles:
  drupal_themes:
  drupal_sites:
  postgres_data:

